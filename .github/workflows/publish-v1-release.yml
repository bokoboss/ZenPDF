name: Publish ZenPDF v1.0.0 release

on:
  push:
    branches:
      - ops/publish-v1.0.0-release

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: 58e39d24976c838c9a582bbfc7ce8596945f2659

      - name: Verify release tag target
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          test "$(git rev-list -n 1 v1.0.0)" = "58e39d24976c838c9a582bbfc7ce8596945f2659"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.0.0 already exists; leaving it unchanged."
          else
            gh release create v1.0.0               --repo "$GITHUB_REPOSITORY"               --verify-tag               --title "ZenPDF v1.0.0"               --notes-file docs/releases/v1.0.0.md
          fi
